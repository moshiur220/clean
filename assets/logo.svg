<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2563EB" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Icon Mark -->
  <g transform="translate(6, 6)" filter="url(#shadow)">
    <!-- Shield / Badge background -->
    <rect x="0" y="0" width="48" height="48" rx="14" fill="url(#primaryGrad)"/>
    
    <!-- Sparkle / Star top right -->
    <path d="M38 8L39.5 12.5L44 14L39.5 15.5L38 20L36.5 15.5L32 14L36.5 12.5L38 8Z" fill="#FDE047" opacity="0.95"/>
    
    <!-- Cleaning bubbles -->
    <circle cx="12" cy="14" r="3" fill="#93C5FD" opacity="0.6"/>
    <circle cx="16" cy="10" r="1.5" fill="#BFDBFE" opacity="0.8"/>
    
    <!-- Checkmark inside clipboard / sparkle shield -->
    <path d="M15 25L22 32L34 18" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Underline accent -->
    <path d="M16 38H32" stroke="url(#accentGrad)" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  
  <!-- Wordmark Text -->
  <text x="64" y="34" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="22" letter-spacing="-0.5" fill="#0F172A">Clean<tspan fill="#2563EB">Inspect</tspan></text>
  <text x="65" y="47" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="8.5" letter-spacing="1.5" fill="#64748B" text-transform="uppercase">Quality &amp; Inspection</text>
</svg>
